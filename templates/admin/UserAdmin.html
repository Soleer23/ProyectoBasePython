      {% include 'admin/cabecera2.html' %}

        <div class="row justify-content-center mb-4">
          <div class="col-md-6">
            <div class="card border-0 bg-dark text-light shadow-sm">
              <div class="card-body text-center p-3">
                <h5 class="mb-0 fw-semibold text-uppercase">
                  <i class="bi bi-people-fill me-2 text-warning"></i> Gestión de Usuarios
                </h5>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-4">
          <!-- Formulario -->
          <div class="col-md-4">
            <div class="card shadow-lg border-0 bg-dark text-light rounded-4">
              <div class="card-header bg-secondary text-light rounded-top">
                <h5 class="mb-0 fw-bold">
                  <i class="bi bi-person-plus me-2 text-warning"></i> Datos del Usuario
                </h5>
              </div>
              <div class="card-body">
                <form action="/admin/UserAdmin/guardar" method="POST">
                  <div class="mb-3">
                    <label for="nom_user" class="form-label fw-semibold text-light">Nombre:</label>
                    <input type="text" class="form-control border-warning bg-dark text-light"
                      id="nom_user" name="nom_user" placeholder="Ingrese el nombre" required />
                  </div>

                  <div class="mb-3">
                    <label for="ape_user" class="form-label fw-semibold text-light">Apellido:</label>
                    <input type="text" class="form-control border-warning bg-dark text-light"
                      id="ape_user" name="ape_user" placeholder="Ingrese el apellido" required />
                  </div>

                  <div class="mb-3">
                    <label for="email_user" class="form-label fw-semibold text-light">Email:</label>
                    <input type="email" class="form-control border-warning bg-dark text-light"
                      id="email_user" name="email_user" placeholder="Ingrese el correo electrónico" required />
                  </div>

                  <div class="d-grid">
                    <input type="submit" class="btn btn-warning text-dark fw-bold mt-2" value="Guardar Usuario" />
                  </div>
                </form>
              </div>
            </div>
          </div>

          <!-- Tabla -->
          <div class="col-md-8">
            <div class="card shadow-lg border-0 bg-dark text-light rounded-4">
              <div class="card-header bg-secondary text-light rounded-top">
                <h5 class="mb-0 fw-bold">
                  <i class="bi bi-table me-2 text-warning"></i> Lista de Usuarios
                </h5>
              </div>
              <div class="card-body p-0">
                <div class="table-responsive">
                  <table class="table align-middle mb-0 custom-table">
                    <thead>
                      <tr class="text-warning border-warning">
                        <th scope="col">ID</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Apellido</th>
                        <th scope="col">Email</th>
                        <th scope="col">Fecha Registro</th>
                        <th scope="col">Acción</th>
                      </tr>
                    </thead>
                    <tbody>
                      {% for usuario in listaUsuarios2 %}
                      <tr>
                        <td>{{ usuario[0] }}</td>
                        <td>{{ usuario[1] }}</td>
                        <td>{{ usuario[2] }}</td>
                        <td>{{ usuario[3] }}</td>
                        <td>{{ usuario[4] }}</td>
                        <td>
                          <form action="/admin/UserAdmin/borrar" method="POST" style="display:inline-block;">
                            <input type="hidden" name="id_usuario" value="{{ usuario[0] }}">
                            <button type="submit" class="btn btn-sm btn-danger">
                              <i class="bi bi-trash-fill"></i> Eliminar
                            </button>
                          </form>
                        </td>
                      </tr>
                      {% endfor %}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

        </div> <!-- fin row usuarios -->

      </div> <!-- fin container-fluid -->
    </div> <!-- fin app-content-body -->

  </div> <!-- fin app-content -->
</main>
<!--end::App Main-->
