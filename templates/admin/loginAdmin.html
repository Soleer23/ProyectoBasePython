<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motorized Love</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Íconos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- CSS propio -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
  <!-- Botón superior -->
  <a href="../admin/index.html" class="btn-public">
    <i class="bi bi-house-door-fill me-1"></i> Página Pública
  </a>

  <!-- LANDING PAGE -->
  <div class="landing" id="landingPage">
    <div class="icon"><i class="bi bi-gem"></i></div>
    <div class="divider"></div>
    <h1>MOTORIZED LOVE</h1>
    <p>Bienvenidos</p>
    <div class="divider"></div>
    <button class="btn-landing" onclick="mostrarLogin()">Iniciar Sesión</button>
  </div>

  <!-- LOGIN CARD -->
  <div class="login-card" id="loginCard">
    <div class="card p-3 shadow-lg">
      <div class="card-header text-center fs-4">
        <i class="bi bi-person-circle me-2"></i>Inicio de Sesión
      </div>
      <div class="card-body">
        <form action="/admin/loginAdmin" method="post">
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" class="form-control" name="usuario" id="usuario" placeholder="Tu usuario" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" name="password" id="password" placeholder="Tu contraseña" required>
          </div>

          <button type="submit" class="btn btn-submit w-100 mt-2">Entrar</button>
        </form>
      </div>

      <div class="card-footer text-center">
        {% if mensaje %}
          <div class="alert alert-warning mt-2" role="alert">
            {{ mensaje }}
          </div>
        {% endif %}
      </div>
    </div>
  </div>

  <script>
    function mostrarLogin() {
      document.getElementById("landingPage").style.display = "none";
      document.getElementById("loginCard").classList.add("active");
    }
  </script>
</body>
</html>
